[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmloop"
version = "0.42.0"
description = "Certified periodic loop acceleration and compositional nested-loop summaries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "pycparser>=2.22"]

[project.optional-dependencies]
test = ["pytest>=7.4,<9.2", "pytest-forked>=1.6"]
smt = ["z3-solver>=4.12"]

[project.scripts]
llmloop = "llmloop.cli:main"
llmloop-c = "llmloop.c_cli:main"
llmloop-graph = "llmloop.graph_cli:main"
llmloop-oscillation = "llmloop.oscillation_cli:main"
llmloop-oscillation-c = "llmloop.oscillation_c_cli:main"
llmloop-smt = "llmloop.smt_cli:main"
llmloop-symbolic = "llmloop.symbolic_cli:main"

[tool.setuptools.packages.find]
include = ["llmloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
