  <rect x="18" y="56" width="216" height="196" rx="10" fill="#FFF7ED" stroke="#B45309" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="30" y="70" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="bold" font-style="normal" fill="#B45309" text-anchor="start" letter-spacing="0.9">UNTRUSTED</text>
