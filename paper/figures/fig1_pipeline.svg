  <path d="M 470 224 L 470 280 L 114 280 L 114 228" fill="none" stroke="#57606A" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ah-muted)"/>
  <text x="302" y="266" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" font-weight="normal" font-style="italic" fill="#57606A" text-anchor="middle">UNKNOWN → counterexample → repair (untrusted again)</text>
  <rect x="28" y="292" width="1102" height="66" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
  <text x="44" y="314" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1F2328"><tspan font-weight="bold" fill="#1F2328">T2 — proposer independence.</tspan><tspan font-weight="normal" fill="#1F2328" dx="7">PROVED is decided only by whether the obligations of I hold, never by where I came from.</tspan></text>
  <text x="44" y="334" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.4" fill="#1F2328"><tspan font-weight="italic" fill="#57606A">What crosses the dashed boundary is a string, I₁…Iₙ</tspan><tspan font-weight="normal" fill="#57606A" dx="7">A proposer can change what is found; it cannot change what is accepted — which is why the red arc never reaches an accepted proof.</tspan></text>
  <line x1="28" y1="376" x2="1130" y2="376" stroke="#D0D7DE" stroke-width="1"/>
  <text x="28" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="start">0 of 90 witnesses rejected by either validator</text>
  <text x="300" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="start">2,912 calls · 9.67 M tokens · $26.98 — every arm</text>
  <text x="620" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="start">T1–T2 are paper proofs (§1b), not machine-checked</text>
</svg>
