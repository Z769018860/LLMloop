<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="412" viewBox="0 0 1160 412" role="img" aria-label="Figure 1. Proposals are strings; acceptance is decided by an unchanged verifier; the certificate is checked by code that shares nothing with it.">
<title>Figure 1. Proposals are strings; acceptance is decided by an unchanged verifier; the certificate is checked by code that shares nothing with it.</title>
<defs>
