  <text x="782" y="246" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="normal" font-style="italic" fill="#57606A" text-anchor="end">fixed for every arm</text>
  <rect x="806" y="56" width="336" height="196" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="818" y="70" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="bold" font-style="normal" fill="#047857" text-anchor="start" letter-spacing="0.9">INDEPENDENT</text>
  <text x="1130" y="246" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="normal" font-style="italic" fill="#57606A" text-anchor="end">shares no code</text>
  <rect x="28" y="80" width="172" height="144" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1.6"/>
  <text x="114" y="106" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1F2328" text-anchor="middle">Proposers</text>
  <text x="114" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">any source, untrusted</text>
  <text x="114" y="143" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">LLM — six models</text>
  <text x="114" y="160" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">trajectory fitter</text>
  <text x="114" y="177" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">sampling + Houdini</text>
  <text x="114" y="194" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">contract writer</text>
  <rect x="262" y="80" width="140" height="144" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
  <text x="332" y="106" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1F2328" text-anchor="middle">Normalisation</text>
  <text x="332" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">C89 index rebasing</text>
  <text x="332" y="143" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">while → for</text>
  <text x="332" y="160" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">UBSan differential</text>
  <rect x="418" y="80" width="232" height="144" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
  <text x="534" y="106" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1F2328" text-anchor="middle">Unchanged verifier</text>
  <text x="534" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">Z3 + typed C integer semantics</text>
  <text x="534" y="143" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">O1 entry · O2 preservation</text>
  <text x="534" y="160" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">O3–O6 exit &amp; definedness</text>
  <text x="534" y="177" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">O7 path coverage · O8 shape</text>
  <text x="534" y="194" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">one code path for every arm</text>
  <rect x="664" y="88" width="118" height="38" rx="7" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
  <text x="723" y="104" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="bold" font-style="normal" fill="#15803D" text-anchor="middle">PROVED</text>
  <text x="723" y="118" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">90 cases</text>
  <rect x="664" y="140" width="118" height="38" rx="7" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
  <text x="723" y="156" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="bold" font-style="normal" fill="#4B5563" text-anchor="middle">UNKNOWN</text>
  <text x="723" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">incl. timeouts</text>
  <rect x="818" y="80" width="312" height="144" rx="9" fill="#FFFFFF" stroke="#047857" stroke-width="1.6"/>
  <text x="974" y="106" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1F2328" text-anchor="middle">Independent re-check</text>
  <text x="974" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="normal" font-style="italic" fill="#57606A" text-anchor="middle">re-runs the property from the witness alone</text>
  <text x="974" y="142" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">90 witnesses, 121 invariants</text>
  <text x="974" y="159" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">invariant_set 2.0, one set per loop</text>
  <text x="974" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">CPAchecker 4.2.2 — 0 rejected</text>
  <text x="974" y="193" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#57606A" text-anchor="middle">Ultimate 0.3.2 — 121/121 invariants</text>
