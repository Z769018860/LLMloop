name: v1.03 full-165, independent and TACLe studies
# Frozen protocols: experiments/v103/{full165,independent,tacle_reference256}/protocol.json
# 165 cases x 3 tools at 600 s / 2 GiB; 257 external cases x 2 tools at 60 s / 512 MiB; 67 TACLe label runs.
# Shards only choose which job executes a scheduled unit; the schedule, command lines and caps are unchanged.
on:
  push:
    branches: [research/v103-exec]
    paths: ['.github/workflows/v103-full.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v103-full
  cancel-in-progress: false
jobs:
  full165:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install package
        run: python -m pip install -q -e '.[test,smt,exp]'
      - name: Prepare pinned inputs
        run: |
          chmod +x scripts/ci_setup_v103.sh
          EXT="${{ runner.temp }}/ext"
          scripts/ci_setup_v103.sh "$EXT" svbench
          scripts/ci_setup_v103.sh "$EXT" tools
      - name: Run shard ${{ matrix.shard }}
        run: |
          EXT="${{ runner.temp }}/ext"
          python -u scripts/fairness_v103.py run --external "$EXT" --output experiments/v103/full165 --shard ${{ matrix.shard }} --shards 6
      - name: Pack artefacts
        if: always()
        run: python -u scripts/pack_v103.py experiments/v103/full165/raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full165-shard-${{ matrix.shard }}
          path: |
            experiments/v103/full165/raw
            experiments/v103/full165/shards
          if-no-files-found: warn
          retention-days: 30

  independent:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install package
        run: python -m pip install -q -e '.[test,smt,exp]'
      - name: Prepare pinned inputs
        run: |
          chmod +x scripts/ci_setup_v103.sh
          EXT="${{ runner.temp }}/ext"
          scripts/ci_setup_v103.sh "$EXT" juliet
          scripts/ci_setup_v103.sh "$EXT" tacle
          scripts/ci_setup_v103.sh "$EXT" tools
      - name: Run shard ${{ matrix.shard }}
        run: |
          EXT="${{ runner.temp }}/ext"
          python -u scripts/independent_v103.py run --external "$EXT" --output experiments/v103/independent --shard ${{ matrix.shard }} --shards 6
      - name: Pack artefacts
        if: always()
        run: python -u scripts/pack_v103.py experiments/v103/independent/raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-shard-${{ matrix.shard }}
          path: |
            experiments/v103/independent/raw
            experiments/v103/independent/shards
          if-no-files-found: warn
          retention-days: 30

  tacle-labels:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install package
        run: python -m pip install -q -e '.[test,smt,exp]'
      - name: Prepare pinned inputs
        run: |
          chmod +x scripts/ci_setup_v103.sh
          EXT="${{ runner.temp }}/ext"
          scripts/ci_setup_v103.sh "$EXT" tacle
          scripts/ci_setup_v103.sh "$EXT" tools
      - name: Label TACLe at unwind 256
        run: |
          EXT="${{ runner.temp }}/ext"
          python -u scripts/label_tacle_v103.py --external "$EXT" --output experiments/v103/tacle_reference256
      - name: Pack artefacts
        if: always()
        run: python -u scripts/pack_v103.py experiments/v103/tacle_reference256/raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tacle-reference256
          path: experiments/v103/tacle_reference256
          if-no-files-found: warn
          retention-days: 30

  regression:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install package, tests and Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18
          python -m pip install -q -e '.[test,smt,exp]'
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$(command -v clang-18)" "$RUNNER_TEMP/bin/clang"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Full regression
        run: python -u scripts/regression_v103.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v103-regression
          path: experiments/v103/regression
          if-no-files-found: warn
          retention-days: 30

  merge:
    needs: [full165, independent, tacle-labels, regression]
    if: always()
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install package
        run: python -m pip install -q -e '.[test,smt,exp]'
      - uses: actions/download-artifact@v4
        with: {pattern: 'full165-shard-*', path: 'incoming/full165', merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {pattern: 'independent-shard-*', path: 'incoming/independent', merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {pattern: 'tacle-reference256', path: 'incoming/tacle_reference256', merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {pattern: 'v103-regression', path: 'incoming/regression', merge-multiple: true}
      - name: Overlay shard outputs
        run: python -u scripts/overlay_v103.py incoming experiments/v103
      - name: Merge and analyse
        run: python -u scripts/merge_v103.py
      - name: Record evidence and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A experiments/v103
          if git diff --cached --quiet; then echo 'no evidence to commit'; exit 0; fi
          git commit -q -m "v1.03: full-165, external and TACLe evidence with summaries [skip ci]"
          git push origin HEAD:refs/heads/research/v103-exec
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v103-merged
          path: |
            experiments/v103/**/results.json
            experiments/v103/**/summary.*
            experiments/v103/merge_status.json
          if-no-files-found: warn
          retention-days: 30
