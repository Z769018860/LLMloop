name: v1.04 witness, one case

# A rejected witness is only a number until you know what the validator saw. CPAchecker answers
# "Property violation (invalid invariant)", which says the program is safe and an invariant is not,
# and then it writes the counterexample that names the invariant -- into `cpa/<case>/`, which the
# batch deletes to keep the artifact small. This job runs one named case and prints that file, so a
# rejection can be explained rather than counted.
#
# Default: termination-restricted-15/b.09_assume.c, one of the four witnesses CPAchecker rejected in
# shard 2 of run 45010719952 while Ultimate accepted it.
on:
  workflow_dispatch:
    inputs:
      case:
        description: 'case name as in the v1.03 protocol, e.g. termination-restricted-15/b.09_assume.c'
        required: false
        default: 'termination-restricted-15/b.09_assume.c'
      validator:
        description: 'cpachecker or ultimate'
        required: false
        default: 'cpachecker'
permissions:
  contents: read
jobs:
  one:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install package
        run: python -m pip install -q -e '.[test,smt,exp]'
      - name: Fetch corpora, CPAchecker and Ultimate
        run: |
          EXT="${{ runner.temp }}/ext"
          mkdir -p "$EXT"
          curl -fsSL --retry 3 -o "$EXT/cpa.zip" https://cpachecker.sosy-lab.org/CPAchecker-4.2.2-unix.zip
          echo "183adce15ced2641784dd16dd1dda3c4d88bb463674d8adb688fb28c3656525f  $EXT/cpa.zip" | sha256sum -c -
          unzip -q -o "$EXT/cpa.zip" -d "$EXT"
          chmod +x scripts/ci_setup_v103.sh
          scripts/ci_setup_v103.sh "$EXT" svbench
          scripts/ci_setup_v103.sh "$EXT" tools
      - name: Export the case
        run: |
          python -u scripts/witness_v104.py make --external "${{ runner.temp }}/ext" \
            --output experiments/v104/witness/one --cases "${{ inputs.case }}" --column-base 1
      - name: Validate it
        continue-on-error: true
        run: |
          python -u scripts/witness_v104.py validate --external "${{ runner.temp }}/ext" \
            --output experiments/v104/witness/one --validator ${{ inputs.validator }} --timeout 300
      - name: Print the program, the witness and what the validator said
        if: always()
        run: |
          D=experiments/v104/witness/one
          echo "===== plan"; cat "$D"/plan.json 2>/dev/null || true
          echo "===== program"; cat -n "$D"/cases/*/program.c 2>/dev/null || true
          echo "===== witness"; cat "$D"/cases/*/witness.yml 2>/dev/null || true
          echo "===== validation"; cat "$D"/validation-*.json 2>/dev/null || true
          echo "===== validator output"
          for f in "$D"/logs/*.txt; do echo "--- $f"; cat "$f" 2>/dev/null; done
          echo "===== counterexample (this is the part the batch deletes)"
          for f in "$D"/counterexamples/*.txt; do echo "--- $f"; cat "$f" 2>/dev/null; done
          echo "===== any counterexample files the tool wrote, before trimming"
          find "$D"/cpa -name 'Counterexample*' 2>/dev/null | head -20
          for f in $(find "$D"/cpa -name 'Counterexample.1.assignment.txt' 2>/dev/null); do
            echo "--- $f"; head -80 "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: witness-one
          path: experiments/v104/witness/one
          if-no-files-found: warn
          retention-days: 14
