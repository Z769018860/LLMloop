name: v1.04 witness probe

# Not an experiment. This job exists to answer four questions before the exporter is written, so
# that the E1 work does not turn into blind round-trips against a validator whose dialect we would
# otherwise be guessing at:
#   1. does CPAchecker 4.2.2 come from a stable URL, and what is its sha256 (to pin in ci_setup)?
#   2. which config files does this CPAchecker ship for witness handling?
#   3. what does a real UAutomizer correctness witness look like, verbatim? (template for ours)
#   4. does `--witness` + correctness-witness-validation--* actually return TRUE here?
on:
  push:
    paths: ['.github/workflows/v104-witness-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Fetch CPAchecker
        run: |
          EXT="${{ runner.temp }}/ext"
          mkdir -p "$EXT"
          curl -fsSL --retry 3 -o "$EXT/cpa.zip" https://cpachecker.sosy-lab.org/CPAchecker-4.2.2-unix.zip
          echo "CPA_SHA256=$(sha256sum "$EXT/cpa.zip" | cut -d' ' -f1)"
          unzip -q -o "$EXT/cpa.zip" -d "$EXT"
          ls "$EXT" | head
          echo "--- config files mentioning witness:"
          ls "$EXT"/CPAchecker-4.2.2-unix/config | grep -i witness || true
      - name: Fetch Ultimate and one benchmark directory
        run: |
          EXT="${{ runner.temp }}/ext"
          chmod +x scripts/ci_setup_v103.sh
          scripts/ci_setup_v103.sh "$EXT" tools
          scripts/ci_setup_v103.sh "$EXT" certbench
      - name: Generate an UAutomizer correctness witness
        run: |
          EXT="${{ runner.temp }}/ext"
          W="${{ runner.temp }}/w"; mkdir -p "$W"
          printf 'CHECK( init(main()), LTL(G ! overflow) )\n' > "$W/o.prp"
          CASE="$EXT/svbench-cert/c/termination-restricted-15/java_Break.c"
          cd "$W"
          timeout 300 python3 "$EXT/ultimate-v0.3.2/UAutomizer-linux/Ultimate.py" \
            --spec o.prp --file "$CASE" --architecture 64bit \
            --witness-type correctness_witness --witness-dir "$W" --witness-name w || true
          echo "=== files:"; ls -la "$W"
          echo "=== WITNESS BEGIN"
          cat "$W/w.graphml" || echo "(no witness produced)"
          echo "=== WITNESS END"
      - name: Validate that witness with CPAchecker
        run: |
          EXT="${{ runner.temp }}/ext"; CPA="$EXT/CPAchecker-4.2.2-unix"
          W="${{ runner.temp }}/w"
          CASE="$EXT/svbench-cert/c/termination-restricted-15/java_Break.c"
          cd "$W"
          for cfg in correctness-witness-validation--overflow.properties correctness-witness-validation.properties; do
            [ -f "$CPA/config/$cfg" ] || { echo "== config $cfg absent"; continue; }
            echo "== config $cfg"
            timeout 300 "$CPA/scripts/cpa.sh" --config "$CPA/config/$cfg" \
              --witness "$W/w.graphml" \
              --spec "$CPA/config/specification/sv-comp-overflow.spc" \
              --64 --timelimit 180s --output-path "$W/out-$cfg" "$CASE" 2>&1 | tail -25
          done
