name: v1.04 witness probe

# Settling the validator before the exporter is pointed at 165 cases. Three rounds of evidence so
# far, each one narrowing the question:
#   * 45007628049 -- CPAchecker 4.2.2 answered "The Witness format found for ... is currently not
#     supported" for a YAML witness, because the config file was passed to --config instead of using
#     the documented --witnessValidation entry point;
#   * 45007989891 -- Ultimate parsed the YAML and refused the entry: "could not be matched:
#     LoopInvariant (L3-2)";
#   * 45008232723 -- with --column-base 1 the entry matched, but Ultimate then said UNKNOWN for both
#     the true and the false invariant.
#
# So two things are still open: whether CPAchecker confirms a witness when invoked as documented, and
# which column convention each validator uses (the entries format defines it zero-based, pycparser
# reports one-based, and a validator that compares exactly will only match one of them). This job
# runs the same two witnesses -- one that must be confirmed, one that must be rejected -- through
# both validators on both conventions. Four verdicts, and the question is settled for both tools.
on:
  push:
    paths: ['.github/workflows/v104-witness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        validator: [cpachecker, ultimate]
        colbase: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install package
        run: python -m pip install -q -e '.[test,smt,exp]'
      - name: Fetch CPAchecker and Ultimate
        run: |
          EXT="${{ runner.temp }}/ext"
          mkdir -p "$EXT"
          curl -fsSL --retry 3 -o "$EXT/cpa.zip" https://cpachecker.sosy-lab.org/CPAchecker-4.2.2-unix.zip
          echo "183adce15ced2641784dd16dd1dda3c4d88bb463674d8adb688fb28c3656525f  $EXT/cpa.zip" | sha256sum -c -
          unzip -q -o "$EXT/cpa.zip" -d "$EXT"
          chmod +x scripts/ci_setup_v103.sh
          scripts/ci_setup_v103.sh "$EXT" tools
      - name: selftest with ${{ matrix.validator }}, column base ${{ matrix.colbase }}
        continue-on-error: true
        run: |
          python -u scripts/witness_v104.py selftest \
            --external "${{ runner.temp }}/ext" \
            --output "experiments/v104/witness/probe/${{ matrix.validator }}_col${{ matrix.colbase }}" \
            --validator ${{ matrix.validator }} --column-base ${{ matrix.colbase }}
      - name: Show the witness under test and the validator's output
        if: always()
        run: |
          D="experiments/v104/witness/probe/${{ matrix.validator }}_col${{ matrix.colbase }}"
          echo "===== program"; cat -n "$D"/cases/selftest/program.c 2>/dev/null || true
          echo "===== witness (true)"; cat "$D"/cases/selftest/witness_true.yml 2>/dev/null || true
          echo "===== result"; cat "$D"/selftest.json 2>/dev/null || true
          echo "===== validator output"
          for f in "$D"/logs/*.txt; do echo "--- $f"; tail -30 "$f" 2>/dev/null; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.validator }}-col${{ matrix.colbase }}
          path: experiments/v104/witness/probe
          if-no-files-found: warn
          retention-days: 14
