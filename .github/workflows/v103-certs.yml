name: v1.03 unresolved certificate re-check

# The v1.00 flat re-check left 30 of 586 certificates unresolved (29 TIMEOUT, 1 ERROR). They were
# never contradicted, they ran out of the 150 s budget. This re-runs only those certificates with
# 600 s per certificate and records the outcome next to the budget that produced it.
#
# The first attempt ran all four studies in one job with four workers and was killed after 56 min
# with no log and no artefact -- the runner itself went away, which is what an out-of-memory kill
# looks like. It is therefore split by study, the address space is bounded per process so a single
# huge certificate cannot take the runner down, and every study writes its rows incrementally.
on:
  push:
    branches: [research/v103-exec]
    paths: ['.github/workflows/v103-certs.yml', 'scripts/cert_recheck_unresolved_v103.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v103-certs
  cancel-in-progress: false

jobs:
  certs:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        study: [nooverflow, hybrid, fresh, fresh_hybrid]
    env:
      PYTHONPATH: ${{ github.workspace }}
      STUDY: ${{ matrix.study }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install package
        run: python -m pip install -q -e '.[test,smt,exp]'
      - name: Prepare pinned inputs
        run: |
          chmod +x scripts/ci_setup_v103.sh
          EXT="${{ runner.temp }}/ext"
          scripts/ci_setup_v103.sh "$EXT" certbench
          scripts/ci_setup_v103.sh "$EXT" cbmc
          echo "LLMLOOP_SVBENCH=$EXT/svbench-cert/c" >> "$GITHUB_ENV"
          echo "LLMLOOP_EXT=$EXT" >> "$GITHUB_ENV"
          echo "$EXT/native/usr/bin" >> "$GITHUB_PATH"
      - name: Re-run the unresolved certificates of ${{ matrix.study }}
        run: |
          bash -c 'ulimit -v 6000000; exec python -u scripts/cert_recheck_unresolved_v103.py "$STUDY" 600 2'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certs-${{ matrix.study }}
          path: experiments/v103/cert_unresolved/${{ matrix.study }}.json
          if-no-files-found: warn

  summary:
    needs: certs
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: certs-*
          merge-multiple: true
          path: experiments/v103/cert_unresolved
      - name: Summarise and record
        run: |
          ls -l experiments/v103/cert_unresolved
          python -u scripts/cert_recheck_unresolved_v103.py summary
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A experiments/v103/cert_unresolved
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -q -m "v1.03: re-check of the certificates left unresolved at 150 s [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --quiet --autostash origin research/v103-exec && git push -q origin HEAD:refs/heads/research/v103-exec && break
            sleep 5
          done
