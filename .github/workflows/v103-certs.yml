name: v1.03 unresolved certificate re-check
# The v1.00 flat re-check left 30 of 586 certificates unresolved (29 TIMEOUT, 1 ERROR). They were
# never contradicted, they ran out of the 150 s budget. This job re-runs only those certificates
# with 600 s per certificate and records the outcome next to the budget that produced it.
on:
  push:
    branches: [research/v103-exec]
    paths: ['.github/workflows/v103-certs.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v103-certs
  cancel-in-progress: false
jobs:
  certs:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install package
        run: python -m pip install -q -e '.[test,smt,exp]'
      - name: Prepare pinned inputs
        run: |
          chmod +x scripts/ci_setup_v103.sh
          EXT="${{ runner.temp }}/ext"
          scripts/ci_setup_v103.sh "$EXT" certbench
          scripts/ci_setup_v103.sh "$EXT" cbmc
          echo "LLMLOOP_SVBENCH=$EXT/svbench-cert/c" >> "$GITHUB_ENV"
          echo "LLMLOOP_EXT=$EXT" >> "$GITHUB_ENV"
          echo "$EXT/native/usr/bin" >> "$GITHUB_PATH"
      - name: Re-run the unresolved certificates
        run: |
          python -u scripts/cert_recheck_unresolved_v103.py nooverflow 600 4
          python -u scripts/cert_recheck_unresolved_v103.py hybrid 600 4
          python -u scripts/cert_recheck_unresolved_v103.py fresh 600 4
          python -u scripts/cert_recheck_unresolved_v103.py fresh_hybrid 600 4
          python -u scripts/cert_recheck_unresolved_v103.py summary
      - name: Record evidence and push
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A experiments/v103/cert_unresolved
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -q -m "v1.03: re-check of the certificates left unresolved at 150 s [skip ci]"
          git pull --rebase --quiet --autostash origin research/v103-exec || true
          git push origin HEAD:refs/heads/research/v103-exec
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v103-cert-unresolved
          path: experiments/v103/cert_unresolved
          if-no-files-found: warn
          retention-days: 30
