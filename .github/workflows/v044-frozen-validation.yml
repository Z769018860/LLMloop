name: v0.44 frozen validation
on:
  push:
    branches: [codex/v044-list-consumer-arguments]
    paths: [.github/workflows/v044-frozen-validation.yml]
permissions:
  contents: write
concurrency:
  group: llmloop-v044-frozen-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching Clang and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18
          python -m pip install -e '.[test,smt]'
          mkdir -p /tmp/llmloop-ci-bin
          ln -s "$(command -v clang-18)" /tmp/llmloop-ci-bin/clang
          echo /tmp/llmloop-ci-bin >> "$GITHUB_PATH"
      - name: Preserve earlier prevalidation observations
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          record={'source_commit':'be082f60ec8a2660ace80c685c09683f0085f818','source_tree':'b280087d4bc63dec48b71b22355115beb2c2d4ae','remote_code_checkpoint':'d4129541b64647f12eeeb6cac96b795c8054f95b','completed':False,'interrupted_after_two_observed_old_test_failures':True,'failed_cases':['test_rotation_keeps_signed_source_semantics_for_each_abi[ILP32]','test_rotation_keeps_signed_source_semantics_for_each_abi[LLP64]'],'standalone_rotation_control':'3 passed; no passing full regression claimed','failure_details_unavailable':'Suite interrupted before final failure traceback; no cause/status inferred'}
          Path('/tmp/v044-prevalidation.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Run the complete frozen-source regression and experiments
        run: python scripts/run_v044_experiments.py --published-source "$GITHUB_SHA" --previous-attempt /tmp/v044-prevalidation.json
      - name: Bind successful evidence to its actual validation origin
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          out=Path('experiments/v044')
          r=json.loads((out/'results.json').read_text())
          m=json.loads((out/'source_manifest.json').read_text())
          assert r['passed'] and all(r['checks'].values())
          assert r['full_pytest']['passed']==1896 and r['full_pytest']['skipped']==0 and r['full_pytest']['exit_code']==0
          assert r['new_tests']==84 and r['github_actions_used'] is True and r['klee_used'] is False
          assert r['complete_c_support'] is False and r['ci_runs_used']==int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert r['validation_origin'].startswith('GitHub Actions fallback')
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert head==os.environ['GITHUB_SHA']==r['tested_commit']==m['tested_commit']
          assert tree==r['tested_tree']==m['tested_tree']
          assert r['source_identity']['git_tree_equal'] and r['source_identity']['published_source_commit']==head
          checkpoint='966c37c7c8b63ff93b3d6538095b85e5a5c304c0'
          changed=subprocess.check_output(['git','diff','--name-only',checkpoint,head],text=True).splitlines()
          assert changed==['.github/workflows/ci.yml','.github/workflows/v044-frozen-validation.yml','scripts/run_v044_experiments.py'],changed
          for p,h in m['sha256'].items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          for p,h in r['evidence_sha256'].items():assert hashlib.sha256((out/p).read_bytes()).hexdigest()==h,p
          url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          ci={'validation_origin':'GitHub Actions fallback after primary execution environment loss','run_url':url,'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'ci_runs_used':int(os.environ['GITHUB_RUN_ATTEMPT']),'validation_commit':head,'validation_tree':tree,'application_code_checkpoint':checkpoint,'application_code_tree':'d37cb94b00789f1956278c7ce05eb7d0521fbc71','local_final_attempt':{'tested_commit':'ec85b49a7241d6951efe0c432797784973692a8f','tested_tree':'d37cb94b00789f1956278c7ce05eb7d0521fbc71','completed':False,'last_observed_progress_percent_at_least':94,'reason':'Primary exec-server transport disconnected and environment marked unavailable','targeted_tests_passed':104,'full_collection_rotation_checks_passed':3,'rotation_checks_overlap_targeted_tests':True,'native_preflight_output_matches':5400,'native_preflight_model_matches':900,'native_preflight_expected_ubsan_failures':20},'only_ci_workflows_and_runner_provenance_changed':True,'frozen_paths_verified':len(m['sha256']),'evidence_files_added':22,'passed':True}
          (out/'validation_ci.json').write_text(json.dumps(ci,indent=2)+'\n')
          r['validation_ci']=ci
          p=out/'report.md'
          with p.open('a') as handle:
              handle.write('\nFinal complete validation origin: **GitHub Actions fallback** because the primary execution environment became unavailable after the last observed local regression progress exceeded 94%, with no failure shown in that corrected attempt. That observation is not a full local pass. The final code checkpoint '+checkpoint+' exactly matches local corrected commit ec85b49a7241d6951efe0c432797784973692a8f at tree d37cb94b00789f1956278c7ce05eb7d0521fbc71. This CI source adds only the isolated validation workflow, accurate runner provenance and a matching primary CI environment (Ubuntu 24.04, Python 3.12, Clang 18; 30-minute job ceiling). No application implementation, test expectation or solver timeout changed. The primary CI job ceiling changes from 12 to 30 minutes to accommodate the full suite; the separate source/solver budgets are unchanged. The 104 targeted checks and 3 overlapping full-collection rotation checks passed locally. The local native preflight passed; the entire pipeline is independently repeated in this CI run. Run: '+url+'. CI attempts this release: '+os.environ['GITHUB_RUN_ATTEMPT']+'. No KLEE.\n')
              handle.write('\nAll '+str(len(m['sha256']))+' frozen tracked paths were checked unchanged after validation. The final release adds only 22 evidence files to validated tree '+tree+'.\n')
          r['evidence_sha256']['validation_ci.json']=hashlib.sha256((out/'validation_ci.json').read_bytes()).hexdigest()
          r['evidence_sha256']['report.md']=hashlib.sha256(p.read_bytes()).hexdigest()
          (out/'results.json').write_text(json.dumps(r,indent=2)+'\n')
          for p,h in r['evidence_sha256'].items():assert hashlib.sha256((out/p).read_bytes()).hexdigest()==h,p
          assert len(list(out.iterdir()))==22
          print(json.dumps({'passed':True,'full_tests':1896,'skipped':0,'frozen_paths':len(m['sha256']),'run_url':url,'validation_tree':tree}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v044-frozen-evidence
          path: experiments/v044/
          if-no-files-found: error
          retention-days: 30
      - name: Save validated evidence on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v044
          git commit -m 'Record verified v0.44 fallback CI evidence [skip ci]'
          git push origin HEAD:refs/heads/codex/v044-list-consumer-arguments
