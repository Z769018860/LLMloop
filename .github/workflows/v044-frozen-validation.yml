name: v0.44 frozen validation
on:
  push:
    branches: [codex/v044-list-consumer-arguments]
    paths: [.github/workflows/v044-frozen-validation.yml]
permissions:
  contents: write
concurrency:
  group: llmloop-v044-frozen-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching Clang and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18
          python -m pip install -e '.[test,smt]'
          mkdir -p /tmp/llmloop-ci-bin
          ln -s "$(command -v clang-18)" /tmp/llmloop-ci-bin/clang
          echo /tmp/llmloop-ci-bin >> "$GITHUB_PATH"
      - name: Preserve earlier prevalidation observations
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          record={'source_commit':'be082f60ec8a2660ace80c685c09683f0085f818','source_tree':'b280087d4bc63dec48b71b22355115beb2c2d4ae','remote_code_checkpoint':'d4129541b64647f12eeeb6cac96b795c8054f95b','completed':False,'interrupted_after_two_observed_old_test_failures':True,'failed_cases':['test_rotation_keeps_signed_source_semantics_for_each_abi[ILP32]','test_rotation_keeps_signed_source_semantics_for_each_abi[LLP64]'],'standalone_rotation_control':'3 passed; no passing full regression claimed','failure_details_unavailable':'Suite interrupted before final failure traceback; no cause/status inferred'}
          Path('/tmp/v044-prevalidation.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Audit isolated scalar proof profile
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from llmloop.integer_lift import IntegerLift,WideningIntegerLift
          from llmloop.typed_nested import TypedCNested
          from llmloop.typed_cfg_heap import TypedCFGHeap
          from llmloop.list_heap import _ListFoldTrajectory
          original=subprocess.check_output(['git','show','63fbc1eaf9b2fef6a2fcce2440fb00286cda22c4:llmloop/integer_lift.py'],text=True)
          assert Path('llmloop/integer_lift.py').read_text().startswith(original+'\n\nclass WideningIntegerLift')
          assert TypedCNested.integer_engine is IntegerLift
          assert TypedCFGHeap.integer_engine is IntegerLift
          assert _ListFoldTrajectory.integer_engine is WideningIntegerLift
          print('Default v0.43 converter unchanged; widened and Mod representations are list-fold-only.')
          PY
      - name: Run the complete frozen-source regression and experiments
        run: python scripts/run_v044_experiments.py --published-source "$GITHUB_SHA" --previous-attempt /tmp/v044-prevalidation.json --previous-ci-runs 1
      - name: Bind successful evidence to its actual validation origin
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          out=Path('experiments/v044')
          r=json.loads((out/'results.json').read_text())
          m=json.loads((out/'source_manifest.json').read_text())
          assert r['passed'] and all(r['checks'].values())
          assert r['full_pytest']['passed']==1896 and r['full_pytest']['skipped']==0 and r['full_pytest']['exit_code']==0
          assert r['new_tests']==84 and r['github_actions_used'] is True and r['klee_used'] is False
          attempts=1+int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert r['complete_c_support'] is False and r['ci_runs_used']==attempts
          assert r['validation_origin'].startswith('GitHub Actions fallback')
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert head==os.environ['GITHUB_SHA']==r['tested_commit']==m['tested_commit']
          assert tree==r['tested_tree']==m['tested_tree']
          assert r['source_identity']['git_tree_equal'] and r['source_identity']['published_source_commit']==head
          checkpoint='25ca08c51059bb3dcdece35f18b886a7a24b9a70'
          changed=subprocess.check_output(['git','diff','--name-only',checkpoint,head],text=True).splitlines()
          assert changed==['.github/workflows/v044-frozen-validation.yml'],changed
          original=subprocess.check_output(['git','show','63fbc1eaf9b2fef6a2fcce2440fb00286cda22c4:llmloop/integer_lift.py'],text=True)
          assert Path('llmloop/integer_lift.py').read_text().startswith(original+'\n\nclass WideningIntegerLift')
          for p,h in m['sha256'].items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          for p,h in r['evidence_sha256'].items():assert hashlib.sha256((out/p).read_bytes()).hexdigest()==h,p
          url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          ci={'validation_origin':'GitHub Actions fallback after primary execution environment loss','run_url':url,'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'ci_runs_used':attempts,'validation_commit':head,'validation_tree':tree,'application_code_checkpoint':checkpoint,'application_code_tree':'6c84193e43145f2eb2e3b6533e8ecb58329f574c','only_isolated_validation_workflow_changed':True,'default_integer_lift_byte_prefix_matches_v043':True,'widening_and_modulo_optimizations_scoped_to_list_fold':True,'first_ci_failure':{'run_id':41227825039,'source_commit':'0f73956a2575a35b2b603c415a974333159d007a','source_tree':'3d5cf385717926a9358fcf3c1e884f420e890442','passed_tests':1893,'failed_tests':3,'skipped_tests':0,'all_standalone_experiments_passed':True,'last_failure_location':'tests/test_llvm_benchmarks.py:90; expected PROVED_DEFINED_CLANG_CFG_CALLS, received UNKNOWN','complete_failure_diagnosis_not_claimed':True},'earlier_local_checkpoint':{'tested_commit':'ec85b49a7241d6951efe0c432797784973692a8f','tested_tree':'d37cb94b00789f1956278c7ce05eb7d0521fbc71','final_full_validation_verified':False,'last_observed_progress_percent_at_least':94,'reason':'Primary exec-server transport disconnected and environment marked unavailable','targeted_tests_passed':104,'full_collection_rotation_checks_passed':3,'rotation_checks_overlap_targeted_tests':True,'native_preflight_output_matches':5400,'native_preflight_model_matches':900,'native_preflight_expected_ubsan_failures':20,'scope':'earlier code checkpoint, not the final isolated profile implementation'},'frozen_paths_verified':len(m['sha256']),'evidence_files_added':22,'passed':True}
          (out/'validation_ci.json').write_text(json.dumps(ci,indent=2)+'\n')
          r['validation_ci']=ci
          p=out/'report.md'
          with p.open('a') as handle:
              handle.write('\nFinal complete validation origin: **GitHub Actions fallback** after primary execution environment loss. The last observed earlier local full-suite progress exceeded 94%, without a failure shown; no complete local pass is claimed. The final application code changed after that earlier checkpoint: widening conversion optimization is now selected only by the list-fold kernel, while the default IntegerLift is retained byte-for-byte from v0.43. Positive integral Mod normalization is also list-fold-only. This final code checkpoint '+checkpoint+' is validated by this CI run, not claimed tested locally. Its tree is 6c84193e43145f2eb2e3b6533e8ecb58329f574c. The CI source adds only the isolated validation workflow.\n')
              handle.write('\nThe first CI attempt (https://github.com/Z769018860/LLMloop/actions/runs/41227825039) had 1893 passing and 3 failing tests, zero skips; all standalone source/native/functional experiments passed. Its last printed failure was an original LLVM calls-backend status check. A complete diagnosis of those three failures is not claimed. The shared widening optimization was then isolated from legacy backends and this different frozen tree was validated from scratch. No test expectation, input domain or SMT query timeout was relaxed. Total CI attempts this release: '+str(attempts)+'. Final run: '+url+'. No KLEE.\n')
              handle.write('\nPrimary CI now uses the matching Ubuntu 24.04 / Python 3.12 / Clang 18 environment and a 30-minute job ceiling rather than the former 12 minutes. This changes the CI job wall limit only; the source/functional solver budgets are unchanged. All '+str(len(m['sha256']))+' frozen paths were checked unchanged. The release adds only 22 evidence files to validated tree '+tree+'.\n')
          r['evidence_sha256']['validation_ci.json']=hashlib.sha256((out/'validation_ci.json').read_bytes()).hexdigest()
          r['evidence_sha256']['report.md']=hashlib.sha256(p.read_bytes()).hexdigest()
          (out/'results.json').write_text(json.dumps(r,indent=2)+'\n')
          for p,h in r['evidence_sha256'].items():assert hashlib.sha256((out/p).read_bytes()).hexdigest()==h,p
          assert len(list(out.iterdir()))==22
          print(json.dumps({'passed':True,'full_tests':1896,'skipped':0,'frozen_paths':len(m['sha256']),'run_url':url,'validation_tree':tree}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v044-frozen-evidence
          path: experiments/v044/
          if-no-files-found: error
          retention-days: 30
      - name: Save validated evidence on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v044
          git commit -m 'Record verified v0.44 fallback CI evidence [skip ci]'
          git push origin HEAD:refs/heads/codex/v044-list-consumer-arguments
