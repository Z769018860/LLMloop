name: v0.44 frozen validation
on:
  push:
    branches: [codex/v044-list-consumer-arguments]
    paths: [.github/workflows/v044-frozen-validation.yml]
permissions:
  contents: write
concurrency:
  group: llmloop-v044-frozen-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching Clang and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18
          python -m pip install -e '.[test,smt]'
          mkdir -p /tmp/llmloop-ci-bin
          ln -s "$(command -v clang-18)" /tmp/llmloop-ci-bin/clang
          echo /tmp/llmloop-ci-bin >> "$GITHUB_PATH"
      - name: Preserve earlier prevalidation observations
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          record={'source_commit':'be082f60ec8a2660ace80c685c09683f0085f818','source_tree':'b280087d4bc63dec48b71b22355115beb2c2d4ae','remote_code_checkpoint':'d4129541b64647f12eeeb6cac96b795c8054f95b','completed':False,'interrupted_after_two_observed_old_test_failures':True,'failed_cases':['test_rotation_keeps_signed_source_semantics_for_each_abi[ILP32]','test_rotation_keeps_signed_source_semantics_for_each_abi[LLP64]'],'standalone_rotation_control':'3 passed; no passing full regression claimed','failure_details_unavailable':'Suite interrupted before final failure traceback; no cause/status inferred'}
          Path('/tmp/v044-prevalidation.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Audit isolated scalar proof profile
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from llmloop.integer_lift import IntegerLift,TypedWordIntegers,WideningIntegerLift
          from llmloop.typed_nested import TypedCNested
          from llmloop.typed_cfg_heap import TypedCFGHeap
          from llmloop.list_heap import _ListFoldTrajectory
          original=subprocess.check_output(['git','show','63fbc1eaf9b2fef6a2fcce2440fb00286cda22c4:llmloop/integer_lift.py'],text=True)
          def converter(source):return source[source.index('    def convert('):source.index('    def promoted(')]
          assert converter(Path('llmloop/integer_lift.py').read_text())==converter(original)
          assert TypedCNested.integer_engine is TypedWordIntegers
          assert TypedCFGHeap.integer_engine is TypedWordIntegers
          assert _ListFoldTrajectory.integer_engine is WideningIntegerLift
          print('Default conversion function unchanged; generic arbitrary-integer semantics retained. Typed source kernels select the explicit word profile; list folds additionally select widening and candidate Mod normalization. Original safety guards remain.')
          PY
      - name: Check word identities and original external-call controls
        run: python -m pytest -q --forked -k 'arithmetic_sign_shift or neutral_masks or sign_mask_abs_idiom or real_library_abort_path_requires_explicit_domain_exclusion or model_samples_replay_the_certified_return_expression or original_upstream_tus_and_headers_through_compilation_database or selective_shifts_match_the_original_all_width_enumeration or generic_lift_keeps_unbounded_integer_shift_contract'
      - name: Run the complete frozen-source regression and experiments
        run: python scripts/run_v044_experiments.py --published-source "$GITHUB_SHA" --previous-attempt /tmp/v044-prevalidation.json --previous-ci-runs 4
      - name: Bind successful evidence to its actual validation origin
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          out=Path('experiments/v044')
          r=json.loads((out/'results.json').read_text())
          m=json.loads((out/'source_manifest.json').read_text())
          assert r['passed'] and all(r['checks'].values())
          assert r['full_pytest']['passed']==1901 and r['full_pytest']['skipped']==0 and r['full_pytest']['exit_code']==0
          assert r['new_tests']==89 and r['github_actions_used'] is True and r['klee_used'] is False
          attempts=4+int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert r['complete_c_support'] is False and r['ci_runs_used']==attempts
          assert r['validation_origin'].startswith('GitHub Actions fallback')
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert head==os.environ['GITHUB_SHA']==r['tested_commit']==m['tested_commit']
          assert tree==r['tested_tree']==m['tested_tree']
          assert r['source_identity']['git_tree_equal'] and r['source_identity']['published_source_commit']==head
          checkpoint='a8ebb0dcbeb59e3fc4dbcaa976dccb0ca2143d4d'
          changed=subprocess.check_output(['git','diff','--name-only',checkpoint,head],text=True).splitlines()
          assert changed==['.github/workflows/v044-frozen-validation.yml'],changed
          original=subprocess.check_output(['git','show','63fbc1eaf9b2fef6a2fcce2440fb00286cda22c4:llmloop/integer_lift.py'],text=True)
          def converter(source):return source[source.index('    def convert('):source.index('    def promoted(')]
          assert converter(Path('llmloop/integer_lift.py').read_text())==converter(original)
          for p,h in m['sha256'].items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          for p,h in r['evidence_sha256'].items():assert hashlib.sha256((out/p).read_bytes()).hexdigest()==h,p
          url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          ci={'validation_origin':'GitHub Actions fallback after primary execution environment loss','run_url':url,'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'ci_runs_used':attempts,'validation_commit':head,'validation_tree':tree,'application_code_checkpoint':checkpoint,'application_code_tree':'8937758c8fbf2ec4f47b90547ab4ea4a19918153','only_isolated_validation_workflow_changed':True,'default_integer_conversion_function_matches_v043':True,'sign_shift_and_neutral_mask_identities_checked':True,'typed_word_profile_explicit':True,'generic_unbounded_integer_semantics_preserved':True,'sign_and_external_preflight_passed':True,'widening_and_modulo_optimizations_scoped_to_list_fold':True,'first_ci_failure':{'run_id':41227825039,'source_commit':'0f73956a2575a35b2b603c415a974333159d007a','source_tree':'3d5cf385717926a9358fcf3c1e884f420e890442','passed_tests':1893,'failed_tests':3,'skipped_tests':0,'all_standalone_experiments_passed':True,'last_failure_location':'tests/test_llvm_benchmarks.py:90; expected PROVED_DEFINED_CLANG_CFG_CALLS, received UNKNOWN','complete_failure_diagnosis_not_claimed':True},'second_ci_failure':{'run_id':41229966583,'source_commit':'dc540945e14811ea91cd01f5ae45ae7fceef1d96','source_tree':'0e4f585b90e10c850d75b8c434cdc07dc8098655','passed_tests':1893,'failed_tests':3,'skipped_tests':0,'all_standalone_experiments_passed':True,'failed_cases':['tests/test_external_call_frontiers.py::test_real_library_abort_path_requires_explicit_domain_exclusion[external_abort_abs]','tests/test_external_call_frontiers.py::test_model_samples_replay_the_certified_return_expression[external_abort_abs]','tests/test_llvm_benchmarks.py::test_original_upstream_tus_and_headers_through_compilation_database[external_abort_abs]'],'suite_status':'UNKNOWN for __absvsi2; independent fresh-worker experiment proved; exact timeout diagnosis not asserted'},'third_ci_preflight_failure':{'run_id':41232552732,'source_commit':'bb438181da280ee2f5beaca3286f041d1e9dbfae','source_tree':'9d60a848e8050f3fd41028ccdad69b30ff6cad88','passed_selected_tests':22,'failed_selected_tests':1,'deselected_tests':1877,'full_regression_not_run':True,'original_abs_failures_all_passed':True,'failure':'New signed-minimum test compared numeric witness string with an integer; observed witness value was -2147483648','correction':'Parse numeric witness string; expected value and implementation unchanged'},'fourth_ci_failure':{'run_id':41232868246,'source_commit':'04b8bf80847a089d3451c8947137758b4cecc325','source_tree':'d672c9266c2f843b3ac98ec58dbcdc2cccd814f8','passed_tests':1898,'failed_tests':2,'skipped_tests':0,'all_standalone_experiments_passed':True,'failed_cases':['test_selective_shifts_match_the_original_all_width_enumeration[>>-signed int]','test_selective_shifts_match_the_original_all_width_enumeration[>>-signed long long]'],'failure':'Generic integer tests require equivalence for unbounded integers; word sign rule requires the typed representability invariant','correction':'Keep generic arbitrary-integer semantics unchanged; select explicit TypedWordIntegers only in typed source kernels; old tests unchanged'},'earlier_local_checkpoint':{'tested_commit':'ec85b49a7241d6951efe0c432797784973692a8f','tested_tree':'d37cb94b00789f1956278c7ce05eb7d0521fbc71','final_full_validation_verified':False,'last_observed_progress_percent_at_least':94,'reason':'Primary exec-server transport disconnected and environment marked unavailable','targeted_tests_passed':104,'full_collection_rotation_checks_passed':3,'rotation_checks_overlap_targeted_tests':True,'native_preflight_output_matches':5400,'native_preflight_model_matches':900,'native_preflight_expected_ubsan_failures':20,'scope':'earlier code checkpoint, not the final isolated profile implementation'},'frozen_paths_verified':len(m['sha256']),'evidence_files_added':22,'passed':True}
          (out/'validation_ci.json').write_text(json.dumps(ci,indent=2)+'\n')
          r['validation_ci']=ci
          p=out/'report.md'
          with p.open('a') as handle:
              handle.write('\nFinal complete validation origin: **GitHub Actions fallback** after primary execution environment loss. The last observed earlier local full-suite progress exceeded 94%, without a failure shown; no complete local pass is claimed. The final application code changed after that earlier checkpoint: widening conversion optimization is now selected only by the list-fold kernel, while the default IntegerLift conversion function is retained unchanged from v0.43. The typed-source word profile uses exact sign-bit and neutral-mask identities under checked representability invariants, while generic IntegerLift retains its original arbitrary-integer shift and bitwise semantics; new full-domain linear/bit-vector lemmas and signed-minimum controls validate those representations. Positive integral Mod normalization is also list-fold-only. This final code checkpoint '+checkpoint+' is validated by this CI run, not claimed tested locally. Its tree is 8937758c8fbf2ec4f47b90547ab4ea4a19918153. The CI source adds only the isolated validation workflow.\n')
              handle.write('\nThe first CI attempt (https://github.com/Z769018860/LLMloop/actions/runs/41227825039) had 1893 passing and 3 failing tests, zero skips; all standalone source/native/functional experiments passed. Its last printed failure was an original LLVM calls-backend status check. A complete diagnosis of those three failures is not claimed. The shared widening optimization was then isolated from legacy backends. A second CI attempt (https://github.com/Z769018860/LLMloop/actions/runs/41229966583) still had the same 1893/3 count: its three failures were all signed-abs tests returning UNKNOWN, while the independent fresh-worker experiment proved that function. The integer lift was then given exact arithmetic sign-bit and neutral-mask representations, retaining all original undefinedness checks. A complete resource/timeout diagnosis is not asserted. This different frozen tree, including four new word-identity/signed-minimum tests, was validated from scratch. No test expectation, input domain or SMT query timeout was relaxed. A third attempt stopped in preflight with 22 passing selected checks and one new assertion comparing the numeric witness string with an integer; the observed signed-minimum witness was correct, all original abs checks passed, and the full suite did not run. The assertion now parses the numeric witness without changing its expected value or implementation. A fourth full attempt had 1898 passing and two failing generic-shift tests; all standalone experiments passed. The generic tests require equivalence for arbitrary mathematical integers, while the new sign rule applies to represented C words. The final implementation separates the typed-word profile from generic IntegerLift, retains the old tests unchanged and adds an unbounded-integer regression. Total CI attempts this release: '+str(attempts)+'. Final run: '+url+'. No KLEE.\n')
              handle.write('\nPrimary CI now uses the matching Ubuntu 24.04 / Python 3.12 / Clang 18 environment and a 30-minute job ceiling rather than the former 12 minutes. This changes the CI job wall limit only; the source/functional solver budgets are unchanged. All '+str(len(m['sha256']))+' frozen paths were checked unchanged. The release adds only 22 evidence files to validated tree '+tree+'.\n')
          r['evidence_sha256']['validation_ci.json']=hashlib.sha256((out/'validation_ci.json').read_bytes()).hexdigest()
          r['evidence_sha256']['report.md']=hashlib.sha256(p.read_bytes()).hexdigest()
          (out/'results.json').write_text(json.dumps(r,indent=2)+'\n')
          for p,h in r['evidence_sha256'].items():assert hashlib.sha256((out/p).read_bytes()).hexdigest()==h,p
          assert len(list(out.iterdir()))==22
          print(json.dumps({'passed':True,'full_tests':1901,'skipped':0,'frozen_paths':len(m['sha256']),'run_url':url,'validation_tree':tree}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v044-frozen-evidence
          path: experiments/v044/
          if-no-files-found: warn
          retention-days: 30
      - name: Save validated evidence on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v044
          git commit -m 'Record verified v0.44 fallback CI evidence [skip ci]'
          git push origin HEAD:refs/heads/codex/v044-list-consumer-arguments
