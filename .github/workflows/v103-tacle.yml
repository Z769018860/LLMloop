name: v1.03 TACLe reference labels (unwind 256)
# Supplementary labelling of the 67 frozen TACLe entries; the main study tolerates its absence.
on:
  push:
    branches: [research/v103-exec]
    paths: ['.github/workflows/v103-tacle.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v103-tacle
  cancel-in-progress: false
jobs:
  tacle:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install package
        run: python -m pip install -q -e '.[test,smt,exp]'
      - name: Prepare pinned inputs
        run: |
          chmod +x scripts/ci_setup_v103.sh
          EXT="${{ runner.temp }}/ext"
          scripts/ci_setup_v103.sh "$EXT" tacle
          scripts/ci_setup_v103.sh "$EXT" tools
      - name: Label TACLe at unwind 256
        # The driver writes one directory per scheduled unit and refuses to reuse an existing one, so
        # re-running it over committed evidence fails by design. The 67 runs are already in the tree;
        # this job only re-runs when the record is incomplete, and never overwrites it.
        env:
          EXT: ${{ runner.temp }}/ext
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          p = Path('experiments/v103/tacle_reference256/results.json')
          done = json.loads(p.read_text()) if p.exists() else {}
          if done.get('complete_capture') and len(done.get('rows', [])) == 67:
              print('complete capture with 67 runs already recorded; nothing to re-run')
              print(json.dumps(done.get('counts'), sort_keys=True))
              sys.exit(0)
          print('record incomplete; running the frozen schedule')
          sys.exit(subprocess.call([sys.executable, '-u', 'scripts/label_tacle_v103.py',
                                    '--external', os.environ['EXT'],
                                    '--output', 'experiments/v103/tacle_reference256']))
          PY
      - name: Pack artefacts
        if: always()
        run: python -u scripts/pack_v103.py experiments/v103/tacle_reference256/raw
      - name: Record evidence and push
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A experiments/v103/tacle_reference256
          if git diff --cached --quiet; then echo 'no evidence to commit'; exit 0; fi
          git commit -q -m "v1.03: TACLe unwind-256 reference labels [skip ci]"
          git -c rebase.autoStash=true pull --rebase --quiet --autostash origin research/v103-exec || true
          git push origin HEAD:refs/heads/research/v103-exec
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tacle-labels-only
          path: experiments/v103/tacle_reference256
          if-no-files-found: warn
          retention-days: 30
