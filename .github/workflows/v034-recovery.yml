name: v034 recovery verification
on:
  push:
    branches: [codex/v034-owned-list-reversal]
permissions:
  contents: write
concurrency:
  group: llmloop-v034-recovery
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang-18 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang-18
          fi
          mkdir -p "$RUNNER_TEMP/llmloop-v034-bin"
          ln -sf "$(command -v clang-18)" "$RUNNER_TEMP/llmloop-v034-bin/clang"
          echo "$RUNNER_TEMP/llmloop-v034-bin" >> "$GITHUB_PATH"
          python -m pip install -e '.[test,smt]'
      - name: Full isolated regression and native identity oracle
        run: python scripts/run_v034_recovery.py
      - name: Preserve actual evidence on recovery branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LLMloop experiment CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- experiments/v034
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record v0.34 recovery verification evidence [skip ci]"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
