name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: llmloop-main-ci
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[test,smt]'
      - name: Unit and regression tests
        run: pytest -q
      - name: Existing C frontend examples
        run: |
          llmloop-c examples/alternating.c --input n=10 --check-range 0:10
          llmloop-c examples/two_phase.c --input n=10 --check-range 0:10
      - name: SPath and nested examples
        run: |
          llmloop-graph examples/three_scc.json --input n=20 --check-range 0:12
          llmloop-graph examples/sign_flip.json --input n=100000
          llmloop-graph examples/nested_graph.json --input n=10 --check-range 0:12
          llmloop-graph examples/three_scc.c --c --control p --values 0,1,2,3 --input n=10 --check-range 0:12

      - name: Oscillatory threshold examples
        run: |
          llmloop-oscillation examples/oscillation_threshold.json --input n=1000000 --check-range=0:30
          llmloop-oscillation-c examples/oscillation_threshold.c --input n=1000000 --check-range=0:30

      - name: Verified SMT SPath, invariant and nested demos
        run: |
          llmloop-smt examples/smt_functional.json --proposals examples/smt_proposals.json --input n=19 --check-range 0:6
          llmloop-smt examples/smt_nonfunctional.json --invariant 'x >= 0 and x <= 6'
          llmloop-smt examples/smt_nested.json --invariant 'p >= 0 and p <= 1' --input n=4
