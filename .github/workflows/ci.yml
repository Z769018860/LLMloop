name: CI
on:
  push:
    branches:
      - main
      - feat/certified-loop-acceleration
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Unit and regression tests
        run: pytest -q
      - name: End-to-end examples
        run: |
          llmloop analyze examples/alternating.json --input n=100 --check-range 0:40
          llmloop analyze examples/progress_every_two.json --input n=100 --check-range 0:40
          llmloop analyze examples/nested_triangular.json --input n=40 --check-range 0:20
