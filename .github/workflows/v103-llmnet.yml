name: v1.04 LLM net benefit and cost

# Arm D of this study is the already frozen v1.03 llmloop evidence; this workflow only runs arm L:
# atoms proposed by a model, then the unchanged verifier. The protocol is written and committed by
# the freeze job before the first real call, and every shard consumes that same frozen protocol.
on:
  workflow_dispatch:
  push:
    branches: [research/v103-exec]
    paths:
      - '.github/workflows/v103-llmnet.yml'

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e '.[test,smt,exp]'
          python -m pip install -q pyyaml psutil
      - name: Fetch the pinned SV-COMP checkout
        run: bash scripts/ci_setup_v103.sh "${{ runner.temp }}/ext" svbench
      - name: Freeze the protocol before the first real call
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          python -u scripts/llm_net_v104.py freeze --external "${{ runner.temp }}/ext" \
            --output experiments/v103/llm_net
          python - <<'PY'
          import json
          p = json.load(open('experiments/v103/llm_net/protocol.json'))
          assert len(p['cases']) == 93, len(p['cases'])
          assert p['remote_model_calls'] == 837, p['remote_model_calls']
          print('frozen cases', len(p['cases']), 'units', 93 * 3 * 3)
          print('served', json.dumps(p['served_model_strings']))
          PY
      - name: Commit the frozen protocol
        run: |
          git config user.name "v103 runner"
          git config user.email "v103@users.noreply.github.com"
          git add experiments/v103/llm_net/protocol.json experiments/v103/llm_net/schedule.json experiments/v103/llm_net/cases_payload.json
          git commit -m "v1.04: freeze the LLM net-benefit protocol before the first real call [skip ci]" || echo "already committed"
          for i in 1 2 3; do
            git pull --rebase --quiet --autostash origin research/v103-exec && git push -q origin HEAD:research/v103-exec && break
            sleep 5
          done
      - uses: actions/upload-artifact@v4
        with:
          name: llmnet-frozen
          path: experiments/v103/llm_net
          if-no-files-found: error

  llmnet:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e '.[test,smt,exp]'
          python -m pip install -q pyyaml psutil
      - uses: actions/download-artifact@v4
        with:
          name: llmnet-frozen
          path: experiments/v103/llm_net
      - name: Run the frozen schedule, shard ${{ matrix.shard }} of 8
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          python -u scripts/llm_net_v104.py run --external "${{ runner.temp }}/ext" \
            --output experiments/v103/llm_net --shard ${{ matrix.shard }} --shards 8 --workers 4
      - name: Summarise the shard
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, collections
          p = pathlib.Path('experiments/v103/llm_net/shards')
          for f in sorted(p.glob('shard_*.json')):
              d = json.loads(f.read_text())
              print(f.name, d['planned'], json.dumps(d['counts'], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llmnet-shard-${{ matrix.shard }}
          path: experiments/v103/llm_net
          if-no-files-found: warn

  merge:
    needs: [freeze, llmnet]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e '.[test,smt,exp]'
          python -m pip install -q pyyaml psutil
      - uses: actions/download-artifact@v4
        with:
          pattern: llmnet-shard-*
          merge-multiple: true
          path: experiments/v103/llm_net
      - name: Merge the shards
        run: python -u scripts/llm_net_v104.py merge --output experiments/v103/llm_net
      - name: Derive the paired comparison and the cost
        run: python -u scripts/analyze_llm_net_v104.py
      - name: Commit the evidence
        run: |
          git config user.name "v103 runner"
          git config user.email "v103@users.noreply.github.com"
          git add experiments/v103/llm_net
          git commit -m "v1.04: LLM net-benefit evidence (93 cases, 3 models, 3 repeats per model) [skip ci]" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase --quiet --autostash origin research/v103-exec && git push -q origin HEAD:research/v103-exec && break
            sleep 5
          done
