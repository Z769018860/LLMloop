name: v1.03 translation differential tests

# Two differential tests the paper needs and cannot get from the corpora alone:
#   A. `llmloop.c_integers.IntegerABI` vs the host compiler under `-fsanitize=undefined`
#      (value *and* definedness, so a too-permissive or too-strict integer model shows up);
#   B. `translate_c` + concrete replay vs the compiled program's return value, on generated
#      single-while programs that stay inside the fragment and inside the no-overflow domain.
# Both are generated from seeds, so the run is reproducible from this file alone.
on:
  workflow_dispatch:
  push:
    branches: [research/v103-exec]
    paths: ['.github/workflows/v103-transdiff.yml']

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install package
        run: python -m pip install -q -e '.[test,smt,exp]'
      - name: Compiler
        run: |
          gcc --version | head -1
          echo "CC=gcc" >> "$GITHUB_ENV"
      - name: Run both differentials
        run: python -u scripts/translation_diff_v103.py all --n 1200 --loops 80 --inputs 12 --overflow-inputs 4 --seed 1
      - name: Show summary
        if: always()
        run: cat experiments/v103/translation_diff/summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-diff
          path: experiments/v103/translation_diff/
          if-no-files-found: warn
      - name: Record evidence
        if: success()
        run: |
          rm -f experiments/v103/translation_diff/integers_seed1.c experiments/v103/translation_diff/integers_seed1.jsonl
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A experiments/v103/translation_diff
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -q -m "v1.03: translation differentials (integer semantics, loop translation) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --quiet --autostash origin research/v103-exec && git push -q origin HEAD:refs/heads/research/v103-exec && break
            sleep 5
          done
