name: v1.04 witness probe 2

# Second probe. The first one (45006809196) answered three of four questions and changed the plan:
#   * CPAchecker 4.2.2 downloads from https://cpachecker.sosy-lab.org/CPAchecker-4.2.2-unix.zip,
#     sha256 183adce15ced2641784dd16dd1dda3c4d88bb463674d8adb688fb28c3656525f, and ships
#     correctness-witness-validation{,-overflow,-termination,...}.properties;
#   * `--witness-type correctness_witness` makes UAutomizer write a *YAML* witness (`w.yml`), not the
#     GraphML one this repo validated in v0.99. The YAML form names the location explicitly
#     (file/line/column), which removes the CFA-alignment problem that a GraphML invariant automaton
#     would have posed. So the exporter targets YAML.
#
# What is still unknown, and is what this job measures:
#   1. the exact bytes of Ultimate's YAML witness (location conventions, column, data_model);
#   2. whether CPAchecker --witness accepts a hand-written YAML witness of that shape;
#   3. whether it is *non-vacuous*: a true invariant must validate TRUE and a false one FALSE.
on:
  push:
    paths: ['.github/workflows/v104-witness-probe2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Fetch tools
        run: |
          EXT="${{ runner.temp }}/ext"
          mkdir -p "$EXT"
          curl -fsSL --retry 3 -o "$EXT/cpa.zip" https://cpachecker.sosy-lab.org/CPAchecker-4.2.2-unix.zip
          echo "183adce15ced2641784dd16dd1dda3c4d88bb463674d8adb688fb28c3656525f  $EXT/cpa.zip" | sha256sum -c -
          unzip -q -o "$EXT/cpa.zip" -d "$EXT"
          chmod +x scripts/ci_setup_v103.sh
          scripts/ci_setup_v103.sh "$EXT" tools
          scripts/ci_setup_v103.sh "$EXT" certbench
      - name: Show Ultimate's YAML witness and the case it refers to
        run: |
          EXT="${{ runner.temp }}/ext"
          W="${{ runner.temp }}/w"; mkdir -p "$W"
          CASE="$EXT/svbench-cert/c/termination-restricted-15/java_Break.c"
          printf 'CHECK( init(main()), LTL(G ! overflow) )\n' > "$W/o.prp"
          cd "$W"
          timeout 300 python3 "$EXT/ultimate-v0.3.2/UAutomizer-linux/Ultimate.py" \
            --spec o.prp --file "$CASE" --architecture 64bit \
            --witness-type correctness_witness --witness-dir "$W" --witness-name w > u.out 2>&1 || true
          grep -E '^Result:' -A2 u.out || true
          echo "=== case, with line numbers:"
          cat -n "$CASE"
          echo "=== sha256:"; sha256sum "$CASE"
          echo "=== ULTIMATE YAML BEGIN"
          cat "$W/w.yml" || echo "(no w.yml)"
          echo "=== ULTIMATE YAML END"
      - name: Validate a hand-written YAML witness (should be TRUE, then FALSE)
        run: |
          EXT="${{ runner.temp }}/ext"; CPA="$EXT/CPAchecker-4.2.2-unix"
          W="${{ runner.temp }}/w"
          CASE="$EXT/svbench-cert/c/termination-restricted-15/java_Break.c"
          H=$(sha256sum "$CASE" | cut -d' ' -f1)
          cd "$W"
          write () { # $1 = file, $2 = invariant string
            cat > "$1" <<EOF
- entry_type: loop_invariant
  metadata:
    format_version: 0.1
    uuid: 6f1a1f6e-0000-4000-8000-00000000000$3
    creation_time: 2026-11-22T09:30:00+00:00
    producer:
      name: llmloop
      version: 1.04
    task:
      input_files:
      - java_Break.c
      input_file_hashes:
        java_Break.c: $H
      specification: CHECK( init(main()), LTL(G ! overflow) )
      data_model: LP64
      language: C
  location:
    file_name: java_Break.c
    file_hash: $H
    line: 10
    column: 4
    function: main
  loop_invariant:
    string: $2
    type: assertion
    format: C
EOF
          }
          for pair in "good|i <= 11 && c == i|1" "bad|i <= 5 && c == i|2"; do
            name=${pair%%|*}; rest=${pair#*|}; inv=${rest%|*}; uid=${rest##*|}
            write "w-$name.yml" "$inv" "$uid"
            echo "===== witness $name : $inv"
            timeout 300 "$CPA/scripts/cpa.sh" --config "$CPA/config/correctness-witness-validation--overflow.properties" \
              --witness "$W/w-$name.yml" \
              --spec "$CPA/config/specification/sv-comp-overflow.spc" \
              --64 --timelimit 120s --output-path "$W/out-$name" "$CASE" 2>&1 | tail -20
          done
          echo "===== also: does Ultimate's own YAML validate?"
          timeout 300 "$CPA/scripts/cpa.sh" --config "$CPA/config/correctness-witness-validation--overflow.properties" \
            --witness "$W/w.yml" \
            --spec "$CPA/config/specification/sv-comp-overflow.spc" \
            --64 --timelimit 120s --output-path "$W/out-ult" "$CASE" 2>&1 | tail -20
